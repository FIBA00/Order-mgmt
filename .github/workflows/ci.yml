name: CI Pipeline

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run all automated tests (Backend, Frontend, Desktop)
        run: pnpm test

  build-frontend:
    name: Build Frontend Bundle
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend production bundle
        run: pnpm build:frontend

      - name: Upload frontend distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: app/frontend/dist
          retention-days: 7

  package-desktop-linux:
    name: Package Desktop (Linux)
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download frontend distribution artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: app/frontend/dist

      - name: Package desktop application
        run: pnpm build:electron

      - name: Archive Linux desktop package
        run: tar -czf restaurant-order-manager-linux-x64.tar.gz -C app/desktop/dist/linux-unpacked .

      - name: Upload Linux desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-x64
          path: restaurant-order-manager-linux-x64.tar.gz
          retention-days: 7

  package-desktop-windows:
    name: Package Desktop (Windows)
    needs: build-frontend
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download frontend distribution artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: app/frontend/dist

      - name: Package desktop application
        run: pnpm build:electron

      - name: Upload Windows desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          path: app/desktop/dist
          retention-days: 7
